[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen3-post-training"
version = "0.1.0"
description = "Reproducible Qwen3-4B inference, SFT, GRPO, and evaluation experiments."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "accelerate>=1.6",
  "datasets>=3.5",
  "numpy>=1.26",
  "peft>=0.15",
  "pyyaml>=6.0",
  "safetensors>=0.5",
  "torch>=2.5",
  "transformers>=4.51",
  "trl>=0.17",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.11"]
code-eval = ["evalplus>=0.3"]
quantization = ["bitsandbytes>=0.45"]
inference = ["vllm>=0.8"]

[project.scripts]
qwen3-infer = "qwen3_post_training.inference:main"
qwen3-sft = "qwen3_post_training.train_sft:main"
qwen3-grpo = "qwen3_post_training.train_grpo:main"
qwen3-eval-gsm8k = "qwen3_post_training.evaluation.evaluate_gsm8k:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
